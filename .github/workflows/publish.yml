name: Publish to npm (Trusted Publishing)

# Publishes to npm via OIDC Trusted Publishing (no long-lived tokens).
# Triggered by pushing a version tag, e.g. `git tag v2.0.1 && git push origin v2.0.1`.
#
# One-time setup on npmjs.com (Settings -> Trusted Publishers) for this package:
#   Provider:  GitHub Actions
#   Owner:     Wagner-Emden-IT-Services
#   Repository: papierkram-mcp-server
#   Workflow:  publish.yml
# The package must have been published manually once before OIDC can be configured.

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC Trusted Publishing
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24 (ships npm 11+ for OIDC)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm >= 11.5.1 (OIDC support)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # No NODE_AUTH_TOKEN / NPM_TOKEN: the npm CLI performs the OIDC exchange itself.
      # Provenance is generated automatically for a public package from a public repo.
      - name: Publish
        run: npm publish
