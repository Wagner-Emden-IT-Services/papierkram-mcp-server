name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@v7
        with:
          # Kein Step in diesem Job braucht authentifiziertes Git. Der Default
          # (true) schreibt den GITHUB_TOKEN in die lokale Git-Config, wo ihn
          # jeder im Job ausgefuehrte Dependency-Code lesen kann — npm ci zieht
          # hier Fremdcode.
          persist-credentials: false

      - name: Node.js ${{ matrix.node-version }} einrichten
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: TypeScript kompilieren
        run: npm run build

      - name: Tests ausfuehren
        run: npm test
